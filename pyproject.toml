[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "red-gold-deck"
version = "0.1.0"
description = "Config-driven red-gold Chinese lecture deck generator (PPTX + DOCX)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Red Gold Deck contributors" }]
keywords = ["pptx", "powerpoint", "chinese", "lecture", "skill", "opencode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = [
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "Pillow>=10.0",
  "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
red-gold-deck = "red_gold_deck.cli:main"

[tool.setuptools.packages.find]
include = ["red_gold_deck*"]

[tool.setuptools.package-data]
red_gold_deck = ["assets/bg/*.jpg", "assets/portraits/.gitkeep", "assets/scenes/.gitkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
